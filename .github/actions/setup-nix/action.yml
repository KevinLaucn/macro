name: Setup Nix
description: >-
  Ensure a working Nix (flakes enabled, daemon running) is available on a
  runner that does not ship Nix preinstalled. Idempotent: when /nix is already
  populated from a cache volume it only re-initialises the daemon and config
  rather than reinstalling the store. Init-agnostic: uses systemd units when
  systemd is active (full VMs), otherwise starts nix-daemon directly as a
  background process (e.g. Namespace runners, where systemd is not active).
  Optionally configures a private S3 binary cache as a substituter: the daemon
  performs substitution, so it is started with the AWS credentials in its
  environment. All four cache inputs must be set for the substituter to be
  configured; otherwise the action behaves exactly as before.

inputs:
  nix-cache-url:
    description: >-
      S3 store URL of the private nix binary cache
      (e.g. s3://macro-nix-cache?region=us-east-1). Empty disables.
    required: false
    default: ''
  nix-cache-public-key:
    description: Public signing key the daemon should trust for that cache.
    required: false
    default: ''
  aws-access-key-id:
    description: AWS access key id for reading the private cache bucket.
    required: false
    default: ''
  aws-secret-access-key:
    description: AWS secret access key for reading the private cache bucket.
    required: false
    default: ''
  nix-cache-signing-key:
    description: Private signing key for signing locally built store paths before uploading to the private cache.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install or re-initialise Nix
      shell: bash
      env:
        NIX_CACHE_URL: ${{ inputs.nix-cache-url }}
        NIX_CACHE_PUBLIC_KEY: ${{ inputs.nix-cache-public-key }}
        NIX_CACHE_AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        NIX_CACHE_AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        NIX_CACHE_SIGNING_KEY: ${{ inputs.nix-cache-signing-key }}
      run: |
        set -euo pipefail

        nix_bin="/nix/var/nix/profiles/default/bin/nix"
        daemon_bin="/nix/var/nix/profiles/default/bin/nix-daemon"

        have_systemd=false
        if [ -d /run/systemd/system ]; then have_systemd=true; fi

        # The private-bucket substituter needs all four pieces: URL, a key to
        # verify signatures, and AWS credentials for the daemon to read S3.
        cache_enabled=false
        if [[ -n "$NIX_CACHE_URL" && -n "$NIX_CACHE_PUBLIC_KEY" \
              && -n "$NIX_CACHE_AWS_ACCESS_KEY_ID" && -n "$NIX_CACHE_AWS_SECRET_ACCESS_KEY" ]]; then
          cache_enabled=true
        fi

        # Streaming upload cache requires signing key in addition to substituter credentials
        streaming_cache_enabled=false
        if $cache_enabled && [[ -n "$NIX_CACHE_SIGNING_KEY" ]]; then
          streaming_cache_enabled=true
        fi

        write_conf() {
          sudo mkdir -p /etc/nix
          current_user="$(id -un 2>/dev/null || echo runner)"
          current_group="$(id -gn 2>/dev/null || echo "$current_user")"

          if $streaming_cache_enabled; then
            # 1. Store private key securely
            printf '%s\n' "$NIX_CACHE_SIGNING_KEY" | sudo tee /etc/nix/cache-private-key >/dev/null
            sudo chmod 600 /etc/nix/cache-private-key
            sudo chown root:root /etc/nix/cache-private-key

            # 2. Setup upload queue directory structure with root:runner-group ownership and 0770 permissions
            sudo mkdir -p /var/lib/nix-cache-upload/staging
            sudo mkdir -p /var/lib/nix-cache-upload/spool
            sudo mkdir -p /var/lib/nix-cache-upload/inflight
            sudo mkdir -p /var/lib/nix-cache-upload/failed
            sudo chown -R root:"$current_group" /var/lib/nix-cache-upload
            sudo chmod 770 /var/lib/nix-cache-upload
            sudo chmod 770 /var/lib/nix-cache-upload/staging \
                           /var/lib/nix-cache-upload/spool \
                           /var/lib/nix-cache-upload/inflight \
                           /var/lib/nix-cache-upload/failed

            # 3. Create post-build-hook script (instantaneous, staging -> sync -> atomic rename to spool)
            cat << EOF_HOOK | sudo tee /etc/nix/cache-upload-hook.sh >/dev/null
        #!/bin/sh
        set -e
        # Nix post-build-hook environment:
        # \$OUT_PATHS - space-separated list of store paths output by the derivation
        # \$DRV_PATH  - store path of the derivation
        BASE_DIR="/var/lib/nix-cache-upload"
        STAGING_DIR="\$BASE_DIR/staging"
        SPOOL_DIR="\$BASE_DIR/spool"

        if [ -n "\$OUT_PATHS" ] && [ -d "\$SPOOL_DIR" ]; then
          for path in \$OUT_PATHS; do
            ts=\$(date +%s%N 2>/dev/null || date +%s)
            rnd=\$(head -c 4 /dev/urandom 2>/dev/null | od -An -tx1 | tr -d ' ' || echo "\$\$")
            tmp_fname="\$STAGING_DIR/\${ts}_\${rnd}.tmp"
            final_fname="\$SPOOL_DIR/\${ts}_\${rnd}.path"
            printf '%s\n' "\$path" > "\$tmp_fname" 2>/dev/null || true
            sync "\$tmp_fname" 2>/dev/null || true
            chmod 660 "\$tmp_fname" 2>/dev/null || true
            chown root:${current_group} "\$tmp_fname" 2>/dev/null || true
            mv -f "\$tmp_fname" "\$final_fname" 2>/dev/null || true
          done
        fi
        exit 0
        EOF_HOOK
            sudo chmod 755 /etc/nix/cache-upload-hook.sh
          fi

          # The minimal config the Determinate installer would have written.
          {
            echo "experimental-features = nix-command flakes"
            echo "trusted-users = root ${current_user}"
            echo "build-users-group = nixbld"
            if $cache_enabled; then
              echo "extra-substituters = $NIX_CACHE_URL"
              echo "extra-trusted-public-keys = $NIX_CACHE_PUBLIC_KEY"
              # A missing narinfo is the common case for freshly built crates;
              # don't let its negative cache linger across a push from another
              # job in the same run.
              echo "narinfo-cache-negative-ttl = 30"
            fi
            if $streaming_cache_enabled; then
              echo "secret-key-files = /etc/nix/cache-private-key"
              echo "post-build-hook = /etc/nix/cache-upload-hook.sh"
            fi
          } | sudo tee /etc/nix/nix.conf >/dev/null
        }

        ensure_nixbld() {
          # Build group/users do not persist outside /nix; recreate if missing.
          if ! getent group nixbld >/dev/null; then
            sudo groupadd -r nixbld || true
            for i in $(seq 1 10); do
              sudo useradd -r -g nixbld -G nixbld -d /var/empty -s "$(command -v nologin || echo /sbin/nologin)" \
                "nixbld$i" 2>/dev/null || true
            done
          fi
        }

        start_daemon() {
          if $have_systemd; then
            if [[ -e /nix/var/nix/profiles/default/lib/systemd/system/nix-daemon.service ]]; then
              sudo cp /nix/var/nix/profiles/default/lib/systemd/system/nix-daemon.* /etc/systemd/system/ || true
              sudo systemctl daemon-reload || true
            fi
            # Restart systemd daemon so newly written nix.conf takes effect
            sudo systemctl try-restart determinate-nixd.service 2>/dev/null \
              || sudo systemctl restart nix-daemon.service 2>/dev/null \
              || sudo systemctl enable --now nix-daemon.socket nix-daemon.service 2>/dev/null || true
          else
            # Non-systemd (Namespace or container runners): stop existing daemon if running so fresh config is reloaded
            if pgrep -f 'nix-daemon|determinate-nixd' >/dev/null 2>&1; then
              echo "Stopping existing nix-daemon to reload updated configuration..."
              sudo pkill -f 'nix-daemon|determinate-nixd' || true
              sleep 1
            fi
          fi

          # Without systemd (or if the unit failed to come up), run the daemon
          # directly: it is just a process listening on the daemon socket.
          if ! sudo test -S /nix/var/nix/daemon-socket/socket; then
            sudo mkdir -p /nix/var/nix/daemon-socket
            sudo rm -f /nix/var/nix/daemon-socket/socket
            daemon_env=()
            if $cache_enabled; then
              daemon_env+=("AWS_ACCESS_KEY_ID=$NIX_CACHE_AWS_ACCESS_KEY_ID")
              daemon_env+=("AWS_SECRET_ACCESS_KEY=$NIX_CACHE_AWS_SECRET_ACCESS_KEY")
            fi
            sudo env "${daemon_env[@]}" sh -c "nohup '$daemon_bin' >/tmp/nix-daemon.log 2>&1 &"
            for _ in $(seq 1 30); do
              if sudo test -S /nix/var/nix/daemon-socket/socket; then break; fi
              sleep 1
            done
            if ! sudo test -S /nix/var/nix/daemon-socket/socket; then
              echo "nix-daemon failed to come up; log follows:" >&2
              sudo cat /tmp/nix-daemon.log >&2 || true
              exit 1
            fi
          fi
        }

        if [[ -x "$nix_bin" ]]; then
          # Store + profiles persist on the cache volume, but config, build
          # users, and the daemon live outside /nix and are gone on a fresh
          # runner. Repair only those.
          echo "Found existing Nix store on cache volume; re-initialising daemon/config only."
          write_conf
          ensure_nixbld
          start_daemon
        else
          echo "No Nix store found on cache volume; performing a full install."
          init_flag="none"
          if $have_systemd; then init_flag="systemd"; fi
          curl --http1.1 --retry 5 --retry-delay 5 --retry-all-errors \
            --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | \
            sh -s -- install linux --no-confirm --init "$init_flag" \
            --extra-conf "experimental-features = nix-command flakes" \
            --extra-conf "trusted-users = root runner"
          # Rewrite the config so the substituter block above applies on fresh
          # installs too, then bring the daemon up ourselves (with --init none
          # the installer lays out the multi-user store but starts no service).
          write_conf
          start_daemon
        fi

        if $cache_enabled; then
          echo "S3 nix cache substituter configured: $NIX_CACHE_URL"
        else
          echo "S3 nix cache substituter not configured (inputs unset); volume-only caching."
        fi

        # Make nix discoverable in subsequent (non-login) steps.
        echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
        export PATH="/nix/var/nix/profiles/default/bin:$PATH"
        export NIX_REMOTE=daemon
        echo "NIX_REMOTE=daemon" >> "$GITHUB_ENV"

        "$nix_bin" --version || nix --version
