# Builds and publishes the images a self-hosted deployment runs.
#
# Hand-written (like deploy-pulumi-stack.yml and the other kebab-case
# workflows) rather than generated by `cargo x workflows`: it is not part of
# Macro's own deploy pipeline and does not touch AWS or Pulumi.
#
# The service image reuses `.#local-stack-binaries` — the same aggregate the
# local dev stack runs — so a self-hosted install and a developer's stack
# execute identical artifacts.
name: Self-host images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to publish (e.g. v1.2.3, or `latest`)
        type: string
        required: true
        default: latest
      services_runner:
        description: Runner for macro-services Rust build (github or self-hosted)
        type: choice
        options:
          - github
          - self-hosted
        required: false
        default: github
      profile:
        description: Build profile (full = full local-stack; email = focused email production core)
        type: choice
        options:
          - full
          - email
        required: false
        default: full

concurrency:
  group: self-host-images-${{ github.ref }}-${{ inputs.profile || 'full' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  NAMESPACE: ${{ github.repository_owner }}

jobs:
  # Cheap and first: a drifted compose file publishes images nobody can run.
  check-drift:
    name: Check self-host artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: 'false'
      - name: Check for drift from the service inventory
        run: python3 self-host/scripts/check-drift.py

  services:
    name: macro-services
    needs: check-drift
    runs-on: ${{ (inputs.services_runner == 'self-hosted') && fromJSON('["self-hosted", "linux", "x64", "macro-builder"]') || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.version.outputs.value }}
      profile: ${{ steps.profile.outputs.value }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: 'false'
      - id: version
        run: echo "value=${{ inputs.version || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - id: profile
        run: echo "value=${{ inputs.profile || 'full' }}" >> "$GITHUB_OUTPUT"
      - name: Setup Nix
        uses: './.github/actions/setup-nix'

      - name: Build diagnostics before build
        run: |
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h
          echo "=== Profile & Target ==="
          echo "Profile: ${{ inputs.profile || 'full' }}"
          echo "Runner: ${{ inputs.services_runner || 'github' }}"
          echo "BUILD_START_TIME=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Build service binaries
        run: |
          set -euo pipefail
          profile="${{ inputs.profile || 'full' }}"
          mkdir -p self-host/build/bin

          if [ "$profile" = "email" ]; then
            echo "Building focused email production aggregate: .#self-host-email-binaries"
            nix build --print-build-logs ".#self-host-email-binaries" --out-link result-bins
            cp -L result-bins/bin/* self-host/build/bin/ 2>/dev/null \
              || cp -RL result-bins/* self-host/build/bin/
          else
            echo "Building full local stack aggregate: .#local-stack-binaries"
            nix build --print-build-logs ".#local-stack-binaries" --out-link result-bins
            cp -L result-bins/bin/* self-host/build/bin/ 2>/dev/null \
              || cp -RL result-bins/* self-host/build/bin/

            # The local-stack aggregate builds authentication_service with
            # `--no-default-features --features return_passwordless_code`, which
            # hands the one-time login code back in the API response and drops
            # the default rate_limit feature. That is a local-development
            # affordance and a full authentication bypass if it is ever served
            # publicly: anyone who can reach the deployment could request a code
            # for any address and read it out of the response. Replace it with
            # the production build the deploy pipeline uses.
            nix build --print-build-logs \
              ".#deploy-service-binaries-authentication-service" --out-link result-auth
            cp -L result-auth/bin/authentication_service self-host/build/bin/authentication_service
          fi

          # The seeding CLI is development tooling; it has no place in a
          # deployment image.
          rm -f self-host/build/bin/seed_cli
          ls -la self-host/build/bin

      - name: Verify the auth binary is the production build
        # Assert the production build is in place and seed CLI is excluded.
        run: |
          set -euo pipefail
          profile="${{ inputs.profile || 'full' }}"
          if [ "$profile" = "full" ]; then
            if cmp -s result-bins/bin/authentication_service \
                      self-host/build/bin/authentication_service; then
              echo "::error::authentication_service is still the local-stack build," \
                   "which returns passwordless login codes in its API response"
              exit 1
            fi
          fi
          test ! -e self-host/build/bin/seed_cli
          echo "auth binary is the production build; seed CLI is not shipped"

      - name: Build the migration runner
        # Build the migration runner into /app/out/macro_db_migrate.
        run: |
          set -euo pipefail
          nix develop --command cargo build --release \
            -p macro_db_migrator --features cli --bin macro_db_migrate
          cp target/release/macro_db_migrate self-host/build/bin/

      - name: Build diagnostics after build
        run: |
          echo "=== Disk after build ==="
          df -h
          if [ -d /nix/store ]; then
            echo "=== /nix/store size ==="
            du -sh /nix/store 2>/dev/null || true
          fi
          build_end=$(date -u +%s)
          build_dur=$(( build_end - BUILD_START_TIME ))
          echo "Nix/Rust build duration: ${build_dur}s"
          echo "BUILD_DURATION=${build_dur}" >> "$GITHUB_ENV"

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          docker_start=$(date -u +%s)
          ns="$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          v="${{ steps.version.outputs.value }}"
          profile="${{ inputs.profile || 'full' }}"
          if [ "$profile" = "email" ]; then
            service_img_name="macro-services-email"
          else
            service_img_name="macro-services"
          fi
          img="$REGISTRY/$ns/${service_img_name}:$v"
          docker build -f self-host/images/Dockerfile.services \
            --build-arg BIN_DIR=build/bin \
            --build-arg MACRO_VERSION="$v" \
            --label "com.kevinlaucn.macro.profile=$profile" \
            -t "$img" self-host
          docker push "$img"
          docker_dur=$(( $(date -u +%s) - docker_start ))
          bin_count=$(find self-host/build/bin -type f -perm -111 | wc -l | tr -d ' ')
          bin_size=$(du -sh self-host/build/bin | awk '{print $1}')

          {
            echo "### 🚀 Macro Services Build Summary"
            echo "- **Runner**: \`${{ inputs.services_runner || 'github' }}\`"
            echo "- **Profile**: \`${profile}\`"
            echo "- **Image**: \`${img}\`"
            echo "- **Nix/Rust Build Duration**: \`${BUILD_DURATION}s\`"
            echo "- **Docker Build & Push Duration**: \`${docker_dur}s\`"
            echo "- **Binary Count**: \`${bin_count}\`"
            echo "- **Output Binaries Size**: \`${bin_size}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: macro-web
    needs: check-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: 'false'
      - name: Setup Nix
        uses: './.github/actions/setup-nix'

      - name: Build diagnostics before build
        run: |
          echo "=== Memory ==="
          free -h
          echo "=== Disk ==="
          df -h

      - name: Build the frontend bundle
        # `same-origin` is what makes one image work on any hostname: the app
        # calls its APIs relative to wherever it is served from. Mirrors
        # xtask_local's `frontend::build_static`.
        run: |
          set -euo pipefail
          nix develop --command bash -c '
            bun install --frozen-lockfile
            cd apps/web
            MODE=development NODE_ENV=production \
            NODE_OPTIONS=--max-old-space-size=6144 \
            VITE_LOCAL_SERVERS=ALL \
            VITE_LOCAL_BACKEND_ORIGIN=same-origin \
            VITE_AI_EDITING_WORKER_URL=/ai-editing \
              bun run --bun build
          '
          mkdir -p self-host/build/dist
          cp -a apps/web/dist/. self-host/build/dist/
          test -f self-host/build/dist/index.html

      - name: Build diagnostics after build
        run: |
          echo "=== Disk after build ==="
          df -h

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          v="${{ inputs.version || github.ref_name }}"
          ns="$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          img="$REGISTRY/$ns/macro-web:$v"
          docker build -f self-host/images/Dockerfile.web \
            --build-arg DIST_DIR=build/dist --build-arg MACRO_VERSION="$v" \
            -t "$img" self-host
          docker push "$img"

  init:
    name: macro-init
    needs: services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: 'false'
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        # Pulls the migration runner out of the service image just published.
        run: |
          set -euo pipefail
          v="${{ needs.services.outputs.version }}"
          profile="${{ needs.services.outputs.profile }}"
          ns="$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          if [ "$profile" = "email" ]; then
            service_img_name="macro-services-email"
            init_img_name="macro-init-email"
          else
            service_img_name="macro-services"
            init_img_name="macro-init"
          fi
          img="$REGISTRY/$ns/${init_img_name}:$v"
          docker build -f self-host/init/Dockerfile \
            --build-arg MACRO_IMAGE_SERVICES="$REGISTRY/$ns/${service_img_name}" \
            --build-arg MACRO_VERSION="$v" \
            --label "com.kevinlaucn.macro.profile=$profile" \
            -t "$img" .
          docker push "$img"

  workers:
    name: ${{ matrix.image }}
    needs: check-drift
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: macro-sync-service
            dockerfile: docker/sync-service.Dockerfile
          - image: macro-lexical-service
            dockerfile: docker/lexical-service.Dockerfile
          - image: macro-ai-editing-worker
            dockerfile: docker/ai-editing-worker.Dockerfile
          - image: macro-analytics-proxy
            dockerfile: docker/analytics-proxy.Dockerfile
          - image: macro-websocket-service
            dockerfile: docker/websocket-service.Dockerfile
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: 'false'
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          set -euo pipefail
          v="${{ inputs.version || github.ref_name }}"
          ns="$(echo "$NAMESPACE" | tr '[:upper:]' '[:lower:]')"
          img="$REGISTRY/$ns/${{ matrix.image }}:$v"
          docker build -f "${{ matrix.dockerfile }}" -t "$img" .
          docker push "$img"
