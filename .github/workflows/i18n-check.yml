name: i18n Health Gate

on:
  push:
    branches:
      - main
      - custom-email-tracking
  pull_request:
    branches:
      - main
      - custom-email-tracking
  workflow_dispatch:

jobs:
  i18n-check:
    name: i18n Infrastructure & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify zh-CN dictionary JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('packages/i18n/locales/zh-CN.json', 'utf8'))"
          echo "✅ zh-CN.json is valid JSON"

      - name: Run i18n runtime test suite
        run: bun test packages/i18n/context.test.ts

      - name: Typecheck i18n package
        run: bun x tsc -p packages/i18n/tsconfig.json --noEmit

      - name: Run AST extraction & verify zero parse failures
        run: |
          bun packages/i18n/extract.ts
          node -e '
            const fs = require("fs");
            const failures = JSON.parse(fs.readFileSync("packages/i18n/diff/parse-failures.json", "utf8"));
            if (failures.length > 0) {
              console.error("❌ Blocking Failure: " + failures.length + " source files failed AST parsing!");
              console.error(JSON.stringify(failures, null, 2));
              process.exit(1);
            }
            console.log("✅ Zero AST parse failures detected across all scanned files.");
          '

      - name: Generate i18n Status Report
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            try {
              const missing = JSON.parse(fs.readFileSync("packages/i18n/diff/missing.json", "utf8"));
              const obsolete = JSON.parse(fs.readFileSync("packages/i18n/diff/obsolete.json", "utf8"));
              const ambiguous = JSON.parse(fs.readFileSync("packages/i18n/diff/ambiguous.json", "utf8"));
              const dict = JSON.parse(fs.readFileSync("packages/i18n/locales/zh-CN.json", "utf8"));

              const missingCount = Object.keys(missing).length;
              const obsoleteCount = Object.keys(obsolete).length;
              const ambiguousCount = Object.keys(ambiguous).length;
              const translatedCount = Object.keys(dict).length;

              const summary = `
          ## 🌐 i18n Infrastructure Health Report
          - **Translated Entries**: ${translatedCount}
          - **Missing Translations**: ${missingCount} ⚠️ (Advisory only)
          - **Obsolete Translations**: ${obsoleteCount}
          - **Ambiguous Context Keys**: ${ambiguousCount}
          - **AST Parse Failures**: 0 ✅

          > **Status**: Core i18n infrastructure is healthy and runtime tests passed.
          `;
              if (process.env.GITHUB_STEP_SUMMARY) {
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
              }
              console.log(summary);
            } catch (e) {
              console.error("Failed to generate summary report:", e);
            }
          '
