[package]
edition = "2024"
name = "macro_db_migrator"
publish = false
version = "0.1.0"

# The migration runner. Off by default so the crate stays as light for its test
# consumers as it was before — only the self-host init image builds it.
[features]
cli = ["dep:tokio"]

[[bin]]
name = "macro_db_migrate"
path = "src/bin/macro_db_migrate.rs"
required-features = ["cli"]

[dependencies]
sqlx = { workspace = true, features = ["migrate"] }
tokio = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
