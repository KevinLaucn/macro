# ast-grep configuration — custom structural rules for repo conventions.
#
# These rules are consumed identically by:
#   - CI            (ast-grep scan)
#   - local runs    (bunx @ast-grep/cli scan)
#
# Rules encode conventions from docs/STYLE_GUIDE.md (repo root). severity: error
# rules are CI-blocking (zero existing violations); severity: warning rules are
# kept for local/manual review while existing violations are burned down.
ruleDirs:
  - rules/ast-grep
